# Mirrors Anthropic's own claude-review.yml pattern
# Auto-triggers on every PR opened
name: PR Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check for POC evidence (before Claude)
        run: |
          echo "=== PRE-RUN CHECK ==="
          echo "CLAUDE_POC_ENV_APPLIED=${CLAUDE_POC_ENV_APPLIED:-not_set}"
          ls -la /tmp/claude-poc-* 2>/dev/null || echo "No POC files yet"
          echo "=== .claude/settings.json contents ==="
          cat .claude/settings.json 2>/dev/null || echo "No .claude/settings.json found"

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review this PR briefly. Just say "LGTM" if it looks fine.
          claude_args: '--max-turns 3'

      - name: Check for POC evidence (after Claude)
        if: always()
        run: |
          echo "=== POST-RUN CHECK ==="
          echo "CLAUDE_POC_ENV_APPLIED=${CLAUDE_POC_ENV_APPLIED:-not_set}"
          ls -la /tmp/claude-poc-* 2>/dev/null || echo "No POC files found"
          cat /tmp/claude-poc-proof.txt 2>/dev/null || echo "No proof file"
          cat /tmp/claude-poc-hook.txt 2>/dev/null || echo "No hook file"
          cat /tmp/claude-poc-env.txt 2>/dev/null || echo "No env file"
